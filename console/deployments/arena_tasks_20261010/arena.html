<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UMI Arena · 后续任务</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172b38;font:15px system-ui,sans-serif}main{max-width:1250px;margin:40px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:28px}a{color:#17647c}p{color:#586b78;line-height:1.7}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,section{background:white;border:1px solid #dee6eb;border-radius:12px;padding:18px}.card{cursor:pointer}.card.selected{outline:2px solid #26869a}img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#e8eef1;border-radius:8px}h2{font-size:19px}small{color:#647884}section{margin-top:24px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:24px}button{border:0;border-radius:8px;padding:12px 22px;background:#167a8c;color:white;font-size:15px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}input{width:90px;padding:9px;border:1px solid #ccc;border-radius:6px;margin:8px 20px 8px 6px}ol{padding-left:24px;line-height:1.65}video{width:100%;background:#1a2730}pre{white-space:pre-wrap;line-height:1.5}#status{color:#235a6b}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.detail{grid-template-columns:1fr}}</style>
<main><header><h1>后续任务仿真环境</h1><a href="http://127.0.0.1:8774/">返回杯子任务控制台</a></header><p>沿用当前双臂与夹爪环境，按官方子步骤进行评测。当前“检查场景”运行物理与相机预览；策略模型可通过相同观测接口接入。</p><div class="cards" id="cards"></div>
<section class="detail"><div><h2 id="title">选择任务</h2><p>初始尺寸和接触参数仍需用实物标定。</p><label>随机种子<input type="number" min="0" id="seed" value="42"></label><label>检查步数<input type="number" min="1" max="300" id="steps" value="60"></label><p><button id="run">检查场景</button> <span id="status"></span></p><img id="live" hidden><p id="links"></p><pre id="summary"></pre></div><div><h2>任务顺序</h2><ol id="primitives"></ol></div></section></main>
<script>let tasks=[],selected='',runId=null;const $=x=>document.getElementById(x);async function json(url,options){const r=await fetch(url,options);const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}function select(id){selected=id;const t=tasks.find(t=>t.id===id);$('title').textContent=t.label;$('primitives').replaceChildren(...t.steps.map(s=>{const l=document.createElement('li');l.textContent=s;return l}));for(const c of document.querySelectorAll('.card'))c.classList.toggle('selected',c.dataset.id===id)}async function init(){const d=await json('/api/catalog');tasks=d.tasks;for(const t of tasks){const c=document.createElement('div');c.className='card';c.dataset.id=t.id;const img=document.createElement('img');img.src='/preview/'+t.id;img.alt=t.label;img.onerror=()=>img.style.visibility='hidden';const h=document.createElement('h2');h.textContent=t.label;const s=document.createElement('small');s.textContent=t.count+' 个子步骤';c.append(img,h,s);c.onclick=()=>select(t.id);$('cards').append(c)}select(tasks[0].id);if(d.active){runId=d.active;poll()}}async function poll(){if(!runId)return;try{const r=await json('/api/runs/'+runId);$('run').disabled=['starting','running'].includes(r.status);$('status').textContent=({starting:'正在启动',running:'正在检查',completed:'检查完成',failed:'检查失败'})[r.status]||r.status;$('live').hidden=false;$('live').src='/runs/'+runId+'/preview.jpg?t='+Date.now();if(r.report){const t=r.report.task;$('summary').textContent=(r.report.error||'三路录像已生成；本次未调用策略模型。')+'\n'+(t?'已完成子步骤：'+t.successful_primitives+'/'+t.planned_primitives:'');$('links').replaceChildren();for(const [file,label] of [['head.mp4','主视角'],['left_wrist.mp4','左腕'],['right_wrist.mp4','右腕'],['report.json','报告']]){const a=document.createElement('a');a.href='/runs/'+runId+'/'+file;a.target='_blank';a.textContent=label;a.style.marginRight='16px';$('links').append(a)}}if(['starting','running'].includes(r.status))setTimeout(poll,2000)}catch(e){$('status').textContent=e.message}}$('run').onclick=async()=>{try{$('run').disabled=true;const r=await json('/api/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task:selected,seed:Number($('seed').value),steps:Number($('steps').value)})});runId=r.id;poll()}catch(e){$('run').disabled=false;$('status').textContent=e.message}};init().catch(e=>$('status').textContent=e.message);</script></html>
